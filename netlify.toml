# Netlify settings for Forge (static site; accounts and progress live in Firebase, see FIREBASE.md)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: any page URL (e.g. /plan/1/notes) serves the app, so refresh and bookmarks work.
# Real files (JS, CSS) are still served normally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have hashed names, so browsers can cache them for a year (saves bandwidth credits).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
